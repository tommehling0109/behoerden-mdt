# MDT – Portainer-Stack MIT FERTIGEM IMAGE (kein Build nötig) – einfach im "Web editor" einfügen
#
# Voraussetzung: Das Image wird von GitHub Actions gebaut (ghcr.io). Ist das Paket privat, in Portainer unter Registries
# ghcr.io mit einem GitHub-Token (read:packages) hinterlegen – oder das Paket auf GitHub öffentlich stellen.
# Keine Variablen nötig – alles hat sinnvolle Standardwerte. Beim ersten Aufruf im Browser startet die Ersteinrichtung.
services:
  mdt:
    image: ghcr.io/tommehling0109/mdt-template:latest
    pull_policy: always
    container_name: mdt-template
    restart: unless-stopped
    init: true
    ports:
      - "${MDT_PORT:-3847}:3847"
    environment:
      HOST: "0.0.0.0"
      PORT: "3847"
      MDT_DATA_DIR: "/data"
      # 1 setzen, wenn ein Reverse-Proxy (Nginx Proxy Manager, Traefik, Caddy …) mit HTTPS davor sitzt
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - mdt-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3847/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mdt-data:
